[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maqra"
version = "0.1.0"
description = "Mirror, verify, package, and publish the verse-by-verse Qur'an recitations of everyayah.com"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Abdalla Eldoumani" }]
keywords = ["quran", "recitation", "audio", "everyayah", "archive"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Religion",
]
dependencies = []

[project.optional-dependencies]
hf = ["huggingface_hub>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
maqra = "maqra.__main__:main"

[project.urls]
Homepage = "https://github.com/Abdalla-Eldoumani/maqra"
Source = "https://github.com/Abdalla-Eldoumani/maqra"

[tool.setuptools]
packages = ["maqra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
